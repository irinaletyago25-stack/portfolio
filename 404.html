<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Модуль пока не разработан · Ирина Летяго</title>
<meta name="description" content="Доходимость модуля: не определена — его пока никто не смог начать.">
<meta property="og:title" content="404 — Модуль пока не разработан · Ирина Летяго">
<meta property="og:description" content="Доходимость модуля: не определена — его пока никто не смог начать.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--milk:#FAFAF6;--milk2:#F4F3EE;--milk3:#E8E6DF;--ink:#0E0E0C;--ink3:#7A7A72;--gold:#E8A000;--fire:#E03A2F;--jade:#1DB87A;--gold-lt:#FFF7E0}
body{overflow-x:hidden;font-family:'DM Sans',sans-serif;background:var(--milk);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.blob{position:fixed;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;filter:blur(3px);opacity:.4;pointer-events:none;animation:bf 14s ease-in-out infinite}
.b1{width:300px;height:280px;background:var(--gold-lt);top:-60px;left:-70px}
.b2{width:240px;height:220px;background:#F0ECFF;bottom:-50px;right:-50px;animation-delay:-6s}
@keyframes bf{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(12px,-14px) rotate(3deg)}}
.box{text-align:center;max-width:560px;position:relative;z-index:1}
.code{font-family:'Space Grotesk',sans-serif;font-size:clamp(90px,20vw,180px);font-weight:700;letter-spacing:-.06em;line-height:1;color:var(--ink)}
.code .z{color:var(--gold);display:inline-block;animation:spin 6s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.02em;margin:18px 0 10px}
.sub{font-size:14px;font-weight:300;color:var(--ink3);line-height:1.7;margin-bottom:32px}
.bar-wrap{max-width:380px;margin:0 auto 8px;height:10px;background:var(--milk3);border-radius:99px;overflow:hidden}
.bar{height:100%;background:var(--gold);border-radius:99px;width:0;transition:width 2.2s cubic-bezier(.2,.8,.3,1)}
.bar-label{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:28px;min-height:18px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:16px 32px;border-radius:999px;border:none;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn-retry{background:var(--ink);color:var(--milk)}
.btn-retry:hover{background:var(--fire)}
.btn-home{background:var(--gold);color:var(--ink);display:none}
.confetti{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:5}

@media(max-width:520px){
  .box{padding:0 4px}
  .btns{flex-direction:column;width:100%}
  .btn{width:100%;text-align:center}
  .bar-wrap{max-width:100%}
}

/* доступность: фокус с клавиатуры */
a:focus-visible,button:focus-visible,[role="link"]:focus-visible,[tabindex]:focus-visible,input:focus-visible,.art-hd:focus-visible,.wf-step:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
*:focus:not(:focus-visible){outline:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="box">
  <div class="code">4<span class="z">0</span>4</div>
  <h1>Этот учебный модуль пока не разработан</h1>
  <p class="sub">Пишу ТЗ, согласовываю учебные цели по Блуму и спорю с дизайнером о дистракторах. Доходимость модуля: не определена — его пока никто не смог начать.</p>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="bar-label" id="bar-label">Разработка модуля: 0%</div>
  <div class="btns">
    <button class="btn btn-retry" id="retry" onclick="attempt()">Обновить страницу</button>
    <a class="btn btn-home" id="home" href="index.html">Ладно, в портфолио →</a>
  </div>
</div>
<script>
let tries=0;
const bar=document.getElementById('bar');
const label=document.getElementById('bar-label');
const retry=document.getElementById('retry');
const home=document.getElementById('home');
const lines=[
  'Разработка модуля: 99%... согласовываю правки',
  'Почти! Ой. Опять 99%. Классика.',
  'Ладно, признаёмся: страницы нет. Зато есть портфолио →'
];
function attempt(){
  bar.style.transition='none';bar.style.width='0';
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    bar.style.transition='width 2.2s cubic-bezier(.2,.8,.3,1)';
    bar.style.width='99%';
    label.textContent='Разработка модуля: загружаем…';
    setTimeout(()=>{
      label.textContent=lines[Math.min(tries,2)];
      tries++;
      if(tries>=3){
        retry.style.display='none';
        home.style.display='inline-block';
        bar.style.background='var(--jade)';
        bar.style.width='100%';
        label.textContent='Модуль «Портфолио» готов на 100% ✓';
        burst();
      }
    },2300);
  })});
}
function burst(){
  const colors=['#E8A000','#E03A2F','#6A4FC8','#1DB87A'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%4];
    c.style.left=50+(Math.random()*30-15)+'%';
    c.style.top='55%';
    document.body.appendChild(c);
    const a=Math.random()*Math.PI*2,v=4+Math.random()*7;
    let x=0,y=0,vx=Math.cos(a)*v,vy=Math.sin(a)*v-6,r=0;
    const t=setInterval(()=>{
      vy+=.4;x+=vx;y+=vy;r+=vx*4;
      c.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`;
      c.style.opacity=Math.max(0,1-y/400);
      if(y>500){clearInterval(t);c.remove()}
    },16);
  }
}
attempt();
</script>
</body>
</html>
